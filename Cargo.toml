[package]
name = "transcript-segmenter"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Group a flat ASR transcript into logical paragraphs by silence, speaker change and sentence boundaries."
license = "MIT"
readme = "README.md"
repository = "https://github.com/klimenkod406/transcript-segmenter"
keywords = ["asr", "transcription", "transcript", "segmentation", "paragraphs"]
categories = ["text-processing", "multimedia::audio"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "demo"
path = "examples/demo.rs"
